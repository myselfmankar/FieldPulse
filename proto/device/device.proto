syntax = "proto3";

package device;

option go_package = "github.com/myselfmankar/FieldPulse/proto/device";

service DeviceService {
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse);
  rpc GetDevice(GetDeviceRequest) returns (Device);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc UpdateDeviceStatus(UpdateDeviceStatusRequest) returns (Device);
  rpc SetThreshold(SetThresholdRequest) returns (Threshold);
  rpc GetThreshold(GetThresholdRequest) returns (Threshold);
}

message CreateDeviceRequest {
  string device_id = 1;
  string floor = 2;
  string device_type = 3;
  string firmware_ver = 4;
}

message CreateDeviceResponse {
  string device_id = 1;
  string broker_url = 2;
  bytes client_cert_pem = 3;
  bytes client_key_pem = 4;
  bytes ca_pem = 5;
}

message Device {
  string device_id = 1;
  string floor = 2;
  string device_type = 3;
  string firmware_ver = 4;
  string status = 5; // active, silent, degraded
  string created_at = 6;
}

message GetDeviceRequest {
  string device_id = 1;
}

message ListDevicesRequest {
  string floor = 1;
  string status = 2;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message UpdateDeviceStatusRequest {
  string device_id = 1;
  string status = 2;
}

message Threshold {
  string device_id = 1;
  float temp_max = 2;
  float vibe_max = 3;
  float current_max = 4;
}

message SetThresholdRequest {
  string device_id = 1;
  float temp_max = 2;
  float vibe_max = 3;
  float current_max = 4;
}

message GetThresholdRequest {
  string device_id = 1;
}
