services:
  postgres:
    image: postgres:15-alpine
    container_name: fieldpulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: device_registry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: fieldpulse-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: telemetry_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fieldpulse-redis
    ports:
      - "6379:6379"

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: fieldpulse-mosquitto
    ports:
      - "8883:8883"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./certs:/mosquitto/config/certs
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  mosquitto-remote:
    image: eclipse-mosquitto:2.0
    container_name: fieldpulse-mosquitto-remote
    ports:
      - "1883:1883"
    volumes:
      - ./configs/mosquitto-remote.conf:/mosquitto/config/mosquitto.conf
    command: mosquitto -c /mosquitto/config/mosquitto.conf

volumes:
  mosquitto_data:
  mosquitto_log:
